# ==========================================================
# BocomADP 唯一配置源（config.yaml）
# 复制模板：cp config.yaml.example config.yaml
#
# 读取优先级（高 → 低）：
#   ① 进程环境变量（BOCOMADP_* 前缀，嵌套字段用 __ 分隔，如
#      BOCOMADP_REDIS__HOST）—— 部署期覆盖，优先级最高
#   ② .env 文件（agent_service/.env 中的 BOCOMADP_* 键）
#   ③ 本文件 config.yaml（含 $VAR / ${VAR} 环境变量引用展开）—— 主配置源
#   ④ 代码默认值（bocomadp/config/）
#
# 框架级参数（log_level / logging / service / redis /
# tools / middlewares / mcp / providers）与业务配置（models /
# app_name / audit / workspace_dir）统一在本文件声明；
# 部署期需要临时覆盖时用 BOCOMADP_* 环境变量（优先级高于本文件）。
# ==========================================================

# ---------- 服务 ----------
# Web UI 标题与健康检查展示的应用名
app_name: "交通银行智能体平台"

# ---------- 日志 ----------
# 调试技能/工具链路时改为 debug（agent 事件流、工具调用、沙箱执行细节）
log_level: debug
logging:
  enhance:
    enabled: true          # trace_id 关联日志增强（TraceContextFilter + 格式化）
    format: text           # text | json（json 推荐生产环境）

# ---------- HTTP 服务 ----------
service:
  host: 0.0.0.0
  port: 8000
  reload: false            # 仅开发期开启 uvicorn 自动重载

# ---------- 数据库（AgentScope 持久化存储 / AsyncSQLAlchemyStorage） ----------
db:
  url: "postgresql+asyncpg://agentscope:agentscope@localhost:5432/agentscope"
  create_tables: true        # dev/单机自动建表；多副本生产改用 alembic upgrade head
  pool_pre_ping: true        # 取连接前探测存活，服务端静默断连时自动重建
  pool_recycle: 1800         # 空闲连接 30 分钟回收，早于防火墙/NAT 空闲超时

# ---------- Redis（消息总线 / 分布式锁 / 缓存） ----------
# 存储后端已迁至上方 db（AsyncSQLAlchemyStorage）；Redis 仅保留给
# RedisMessageBus 等瞬时协调用途。当前 main.py 用 InMemoryMessageBus，
# 此段为预留，多 worker 时切 RedisMessageBus 即用。
redis:
  host: localhost
  port: 6379

# /chat 并发控制(0=不限)
run_concurrency:
  enabled: false
  max_running: 2
  max_running_per_user: 1
  grace_secs: 30

# ---------- 组件注册表 ----------
# 三大 registry（工具 / agent 中间件 / MCP）统一开关：
# enabled 控制内置组件扫描，load_custom 控制 custom/ 目录自动扫描。
tools:
  enabled: true
  load_custom: true

middlewares:
  enabled: true
  load_custom: true

mcp:
  enabled: true
  load_custom: true

# ---------- 模型 Provider（启动时自动注册到 ProviderManager） ----------
providers:
  enabled: true
  config_file: null        # null 表示使用本文件（config.yaml）；可指向其他 YAML

models:
  # 支持的 provider_type (简写即可):
  #   deepseek / openai / anthropic / dashscope / gemini
  #   ollama / moonshot / xai
  # 也可写全称: deepseek_credential / openai_credential / ...
  #
  # api_key 支持两种写法：
  #   1. ${ENV_VAR}  — 从环境变量读取（推荐，避免硬编码密钥）
  #   2. sk-xxx      — 直接写明文（仅限本地开发）
  #
  # parameters 中的字段会透传给对应 ChatModel 的 Parameters 模型，
  # 例如 DeepSeekChatModel.Parameters 支持:
  #   temperature / max_tokens / top_p / thinking_enable / reasoning_effort
  - provider_id: deepseek
    display_name: "DeepSeek Chat"
    provider_type: deepseek
    model_name: deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com
    is_active: true
    supports_multimodal: false
    parameters:
      temperature: 0.7
      max_tokens: 4096
      thinking_enable: false

  # --- 取消注释以启用更多 provider ---
  # - provider_id: deepseek-reasoner
  #   display_name: "DeepSeek Reasoner (R1)"
  #   provider_type: deepseek
  #   model_name: deepseek-reasoner
  #   api_key: ${DEEPSEEK_API_KEY}
  #   base_url: https://api.deepseek.com
  #   is_active: false
  #   supports_multimodal: false
  #   parameters:
  #     thinking_enable: true
  #     reasoning_effort: high

  # - provider_id: openai
  #   display_name: "GPT-4o"
  #   provider_type: openai
  #   model_name: gpt-4o
  #   api_key: ${OPENAI_API_KEY}
  #   base_url: https://api.openai.com/v1
  #   is_active: false
  #   supports_multimodal: true
  #   parameters:
  #     temperature: 0.7

# ---------- 场景（Agent 模板） ----------
# 每个场景 = 预设 Agent 模板（系统提示词 + 模型 + 工具白名单 + 技能白名单 + 迭代上限）。
# 运行时通过 POST /api/chat/run 的 agent_id 选择场景；启动时由 lifespan
# 幂等同步进框架 StorageBase（chat / deerflow 可见）。
# model_provider 留空时使用 ProviderManager 的全局 active provider。
# enabled_skills 为技能白名单（匹配技能 frontmatter name 或目录名），空 = 全部技能。
agents:
  - agent_id: default
    name: "通用助手"
    system_prompt: "You are a helpful AI assistant. Use the available tools to answer user questions."
    model_provider: ""
    model_name: ""
    max_iters: 20
    enabled_tools: []
    enabled_skills: []

  - agent_id: customer_service
    name: "客服助手"
    system_prompt: "你是交通银行智能客服助手。请礼貌、简洁地回答客户问题；涉及余额、流水等敏感信息时，必须先确认客户身份。"
    model_provider: deepseek
    model_name: deepseek-chat
    max_iters: 20
    enabled_tools: []

  - agent_id: risk_control
    name: "风控分析助手"
    system_prompt: "你是银行风控分析专家。请基于给定数据给出严谨的风险评估结论，明确标注数据来源与不确定性，禁止编造指标。"
    model_provider: deepseek
    model_name: deepseek-chat
    max_iters: 30
    enabled_tools: []

# ---------- 审计（Audit） ----------
audit:
  # 审计留痕开关：记录每次 agent 调用（谁/何时/用了哪些工具/输出摘要）
  enabled: true
  # 日志路径（JSONL）
  log_path: "./logs/audit.jsonl"

# ---------- 运行时目录 ----------
# 工作区目录（AgentScope 沙箱文件读写根目录 + 会话持久化根目录：
# sessions/{user_id}/{agent_id}/{session_id}.json）
# 支持 $VAR 环境变量引用展开
workspace_dir: "./workspaces"


# ---------- 跨知识搜索 ----------
# 扁平结构：键与 cross_search_config.py 字段一一对应。
# 字符串值支持 $VAR / ${VAR} 环境变量引用展开（如 api_url: $CROSS_SEARCH_API_URL）。
cross_search:
  # api_url 支持环境变量引用展开，运行时需设置 CROSS_SEARCH_API_URL
  api_url: $CROSS_SEARCH_API_URL
  timeout: 30
  caller: "VD2026000"
  search_type: "0"
  text_top_n: 5
  vector_top_n: 5
  qa_type: [0, 1]
  attach_flag: 1
  rerank_flag: 1
  rewrite_flag: "ON"
  rerank_top_n: 5
  rerank_rule_code: "RR0005"
  vector_min_score: 0.54
  user_role: "0"
  space_code_list: []
  team_space_code_list: []
  user_code: "U000000000000000"
  psnl_space_code_id: "PER754964863350213"
  psnl_category_id_list: []
  second_search_kb_codes: []
  headers:
    Accept: "*/*"
    Accept-Encoding: "gzip, deflate, br"
    Connection: "keep-alive"
    Content-Type: "multipart/form-data"
    jumpcloud-ENV: "BASE"


# ---------- 文件上传能力 ----------
# 非图片文件上传 / 格式转换（-> Markdown）/ 上下文注入。
# base_dir 为独立上传根（不挂在 workspace 下），相对路径基于 BASE_DIR 归一化。
# 支持文本/代码、PDF、Word、PPT、Excel、HTML 转 .md；图片在接口层拒绝；
# 其余格式（压缩包等）暂不支持。
uploads:
  enabled: true
  base_dir: "./uploads"          # 上传文件根目录 {base}/{user_id}/sessions/{session_id}/files/
  max_file_size_mb: 50.0         # 单文件大小上限（MB）
  max_files_per_session: 50       # 单会话最大文件数
  streaming_threshold_mb: 10.0    # 超过此阈值走流式/分块上传（MB）
  max_pdf_pages: 1000            # PDF 页数上限（超出拒绝）
  max_filename_length: 255       # 文件名最大长度

