name: Web UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-ui.yml"
      - "examples/web_ui/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/web-ui.yml"
      - "examples/web_ui/**"

jobs:
  check:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !contains(github.event.pull_request.title, 'WIP'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/web_ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: examples/web_ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

  confirmation:
    name: Keyboard confirmation (${{ matrix.os }})
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.title, 'WIP')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: examples/web_ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: examples/web_ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend build
      - name: Test keyboard confirmation
        run: |
          pnpm --filter frontend exec playwright-core install --with-deps chromium
          pnpm --filter frontend test:confirmation
