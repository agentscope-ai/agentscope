name: PR Duplicate Guard

# Tells a new pull request when the issue it closes is already claimed by
# somebody else, or already has an open pull request.
#
# `pull_request_target` is required because a fork's `pull_request` token is
# read-only and cannot comment — the same reason pr-review-relay.yml exists.
# It is only safe here because this workflow NEVER checks out or runs any code
# from the pull request: it reads the event payload and the API, nothing else.
# Do not add a checkout step.

on:
  pull_request_target:
    types: [opened, edited]

permissions: {}

jobs:
  guard:
    if: github.event.pull_request.draft == false
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-duplicate-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/github-script@v7
        env:
          # Never interpolated into a shell; read as data below.
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const MARKER = '<!-- duplicate-guard -->';

            // `edited` fires on every body change, so say each thing once.
            const { data: mine } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            if (mine.some((c) => c.body.includes(MARKER))) {
              core.notice('Already commented on this pull request.');
              return;
            }

            // Only body-text links are visible to a workflow. A link made
            // through the Development sidebar fires no event we can catch.
            const body = process.env.PR_BODY || '';
            const linked = [...body.matchAll(
              /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi,
            )].map((m) => Number(m[1]));
            const issues = [...new Set(linked)];
            if (issues.length === 0) {
              core.notice('No closing keyword in the body; nothing to check.');
              return;
            }

            const notes = [];
            for (const issue_number of issues) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({
                  owner, repo, issue_number,
                }));
              } catch (error) {
                core.notice(`#${issue_number}: ${error.message}`);
                continue;
              }
              if (issue.pull_request) continue;  // it linked a PR, not an issue

              const names = issue.labels.map(
                (l) => (typeof l === 'string' ? l : l.name),
              );

              // Who holds the claim, per the record the claim workflow left.
              let holder = null;
              if (names.includes('triage/claimed')) {
                const { data: comments } =
                  await github.rest.issues.listComments({
                    owner, repo, issue_number, per_page: 100,
                  });
                const record = comments.reverse().find(
                  (c) => c.body.includes('<!-- claim-record -->'),
                );
                const found = record && record.body.match(/@([\w-]+)/);
                holder = found ? found[1] : null;
              }

              // Other open pull requests that reference this issue.
              const { data: timeline } =
                await github.rest.issues.listEventsForTimeline({
                  owner, repo, issue_number, per_page: 100,
                });
              const others = new Map();
              for (const event of timeline) {
                const source = event.source && event.source.issue;
                if (event.event !== 'cross-referenced' || !source) continue;
                if (!source.pull_request || source.number === pr.number) continue;
                if (source.state !== 'open') continue;
                others.set(source.number, source.user.login);
              }

              if (holder && holder !== author) {
                notes.push(
                  `- #${issue_number} is claimed by @${holder}. Please leave ` +
                  `it with them while the claim stands — it is released after ` +
                  `14 days of inactivity.`,
                );
              }
              for (const [number, who] of others) {
                notes.push(
                  who === author
                    ? `- #${issue_number} already has your own open pull ` +
                      `request #${number}. Consider continuing there instead ` +
                      `of opening a second one.`
                    : `- #${issue_number} already has an open pull request, ` +
                      `#${number} by @${who}.`,
                );
              }
            }

            if (notes.length === 0) {
              core.notice('Nothing to flag.');
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body:
                `${MARKER}\nThanks for the pull request. Before it gets ` +
                `reviewed, one thing worth sorting out:\n\n` +
                `${notes.join('\n')}\n\n` +
                `If you believe this is the right place for your change ` +
                `anyway, say so here and a maintainer will take a look.`,
            });
            core.notice(`Flagged ${notes.length} item(s).`);
