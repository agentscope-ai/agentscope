name: Issue Claim

# Lets a contributor take an issue by saying so in a comment.
#
# The claim is a real assignee. GitHub allows assigning anyone who has taken
# part in the issue, and whoever claims it has just commented, so the person
# asking is always assignable.

on:
  issue_comment:
    types: [created]

permissions: {}

env:
  TRIAGE_MODEL: qwen3.8-max
  CLAIM_DAYS: '14'
  MAX_CLAIMS: '5'
  MAINTAINERS: DavdGao qbc2016

jobs:
  claim:
    # `issue_comment` fires for pull request comments too, and a bot answering
    # itself would loop.
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Serial per issue: two claims arriving together must not both win.
      group: issue-claim-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Most comments say nothing about claiming, and those should cost
      # seconds rather than an install and a model call.
      - name: Could this be a claim?
        id: gate
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          mkdir -p /tmp/claim
          printf '%s' "$BODY" > /tmp/claim/comment.md
          # Only a bare self-claim skips the classifier: `/assign @someone`
          # asks for a third party, which is not a claim at all.
          if grep -qiE '^[[:space:]]*/assign([[:space:]]+me)?[[:space:]]*$' /tmp/claim/comment.md; then
            echo "verdict=explicit" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'assign|claim|take (this|it)|work(ing)? on|pick (this|it) up|认领|我来|我想做|接手' /tmp/claim/comment.md; then
            echo "verdict=maybe" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          # Otherwise the job token is left in .git/config, where the
          # agent's own shell could read it and act as this job.
          persist-credentials: false
        if: steps.gate.outputs.verdict == 'maybe'

      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.verdict == 'maybe'
        with:
          python-version: '3.11'

      - name: Ask whether the comment is really a claim
        id: intent
        if: steps.gate.outputs.verdict == 'maybe'
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          uv venv --clear --python 3.11
          uv pip install --python .venv/bin/python -e ".[dev]"
          result=$(.venv/bin/python scripts/claim_intent.py \
            --comment-file /tmp/claim/comment.md \
            --model "$TRIAGE_MODEL")
          echo "$result"
          echo "wants=$(echo "$result" | python3 -c \
            'import json,sys; print(str(json.load(sys.stdin)["wants_to_claim"]).lower())')" \
            >> "$GITHUB_OUTPUT"

      - name: Answer the claim
        if: >-
          steps.gate.outputs.verdict == 'explicit' ||
          steps.intent.outputs.wants == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            const { owner, repo } = context.repo;
            const who = context.payload.comment.user.login;
            const days = Number(process.env.CLAIM_DAYS);
            const maintainers = process.env.MAINTAINERS.split(/\s+/);

            const say = (body) => github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });

            const { data: issue } = await github.rest.issues.get({
              owner, repo, issue_number,
            });
            const names = issue.labels.map(
              (l) => (typeof l === 'string' ? l : l.name),
            );
            const has = (n) => names.includes(n);
            const holders = issue.assignees.map((a) => a.login);

            if (holders.includes(who)) {
              core.notice('Already theirs; nothing to do.');
              return;
            }

            // Whether the issue is open for work at all comes first. Deciding
            // it after the assignee checks would let a lapsed claim be handed
            // on for an issue nobody may claim in the first place.
            if (has('triage/verifying')) {
              await say(
                'This issue is still being verified. Please comment again ' +
                'once it is confirmed, and it is yours.',
              );
              return;
            }

            const triaged = names.some((n) => n.startsWith('triage/'));
            if (!triaged) {
              // No label is only evidence of age once triage has had its run:
              // this workflow and the triage one fire on separate events, so a
              // comment can arrive before the first label is applied.
              const age = Date.now() - new Date(issue.created_at).getTime();
              if (age < 30 * 60000) {
                await say(
                  'This issue is new and has not been through verification ' +
                  'yet. Please comment again in a few minutes.',
                );
                return;
              }
            } else if (!has('triage/confirmed')) {
              await say(
                'This issue has not been confirmed as a bug, so it is not ' +
                'open for work yet. Its triage labels: ' +
                names.filter((n) => n.startsWith('triage/')).join(', ') + '.',
              );
              return;
            }

            // On the roadmap means the maintainers are carrying it, unless it
            // is explicitly offered to the community.
            if (has('Roadmap') && !has('Help Wanted')) {
              await say(
                'Thanks for offering. This one is on the roadmap and the ' +
                'maintainers are carrying it, so it is not open to the ' +
                'community yet — the ones that are carry the `Help Wanted` ' +
                'label.',
              );
              return;
            }

            // Spread thin, nothing gets finished. A maintainer's load is
            // their own business.
            if (!maintainers.includes(who)) {
              const mine = (await github.paginate(
                github.rest.issues.listForRepo,
                { owner, repo, assignee: who, state: 'open', per_page: 100 },
              )).filter((i) => !i.pull_request);
              if (mine.length >= Number(process.env.MAX_CLAIMS)) {
                await say(
                  `Thanks for offering, @${who}. To keep the work focused, ` +
                  'please concentrate on the issues you already hold first: ' +
                  mine.map((i) => `#${i.number}`).join(', ') + '.',
                );
                return;
              }
            }

            if (holders.length > 0) {
              // A claim the maintainers hold is theirs for as long as they
              // want it.
              if (holders.some((h) => maintainers.includes(h))) {
                await say(
                  `This one is with ${holders.map((h) => '@' + h).join(', ')}.`,
                );
                return;
              }

              // Is the standing claim stale? The same rule as
              // claim-expiry.yml — keep the two in step if either changes.
              // `issue.updated_at` is useless here: the claiming comment just
              // bumped it. And a cross-reference is only a mention, so each
              // candidate is asked what it really closes, or any pull request
              // naming the issue would keep a dead claim alive.
              const { repository } = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      timelineItems(
                        first: 100, itemTypes: [CROSS_REFERENCED_EVENT]
                      ) {
                        nodes {
                          ... on CrossReferencedEvent {
                            source {
                              ... on PullRequest {
                                state
                                closingIssuesReferences(first: 10) {
                                  nodes { number }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }`, { owner, repo, number: issue_number });
              const working = repository.issue.timelineItems.nodes.some((n) => {
                const s = n.source;
                return s && s.state === 'OPEN' &&
                  s.closingIssuesReferences.nodes.some(
                    (i) => i.number === issue_number,
                  );
              });

              const timeline = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                { owner, repo, issue_number, per_page: 100 },
              );
              const marks = timeline
                .filter((e) => (
                  (e.event === 'assigned' &&
                    holders.includes(e.assignee && e.assignee.login)) ||
                  (e.event === 'commented' &&
                    holders.includes(e.actor && e.actor.login))
                ))
                .map((e) => new Date(e.created_at).getTime());
              const last = marks.length ? Math.max(...marks) : 0;

              if (working || last >= Date.now() - days * 86400000) {
                await say(
                  'This issue is already claimed by ' +
                  `${holders.map((h) => '@' + h).join(', ')}. The claim is ` +
                  `released after ${days} days with no pull request and no ` +
                  'word from them, and you are welcome to take it then.',
                );
                return;
              }
              await github.rest.issues.removeAssignees({
                owner, repo, issue_number, assignees: holders,
              });
              await github.rest.issues.addAssignees({
                owner, repo, issue_number, assignees: [who],
              });
              await say(
                `The earlier claim went quiet for more than ${days} days, so ` +
                `this is yours now, @${who}. Thanks for picking it up.`,
              );
              return;
            }

            await github.rest.issues.addAssignees({
              owner, repo, issue_number, assignees: [who],
            });
            const until = new Date(Date.now() + days * 86400000)
              .toISOString()
              .slice(0, 10);
            await say(
              `It's yours, @${who}. If there is no pull request and no word ` +
              `from you by ${until} the claim is released so nobody is ` +
              'blocked — a comment here renews it.',
            );
