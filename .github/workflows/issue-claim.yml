name: Issue Claim

# Lets a contributor take an issue by saying so in a comment.
#
# The claim is recorded as the `triage/claimed` label plus a comment, not as an
# assignee: GitHub only allows assigning users with push access, and
# `addAssignees` silently ignores everyone else — so assigning an outside
# contributor would look like it worked and do nothing.

on:
  issue_comment:
    types: [created]

permissions: {}

env:
  TRIAGE_MODEL: qwen3.8-max
  CLAIM_DAYS: '14'

jobs:
  claim:
    # `issue_comment` also fires for pull request comments, and a bot replying
    # to itself would loop.
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Serial per issue: two claims arriving together must not both win.
      group: issue-claim-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # A cheap gate first: most comments say nothing about claiming, and
      # they should cost seconds rather than a model call and an install.
      - name: Could this be a claim?
        id: gate
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          mkdir -p /tmp/claim
          printf '%s' "$BODY" > /tmp/claim/comment.md
          if grep -qiE '^[[:space:]]*/assign\b' /tmp/claim/comment.md; then
            echo "verdict=explicit" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'assign|claim|take (this|it)|work(ing)? on|pick (this|it) up|认领|我来|我想做|接手' /tmp/claim/comment.md; then
            echo "verdict=maybe" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.verdict == 'maybe'

      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.verdict == 'maybe'
        with:
          python-version: '3.11'

      - name: Ask whether the comment is really a claim
        id: intent
        if: steps.gate.outputs.verdict == 'maybe'
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
          result=$(.venv/bin/python scripts/claim_intent.py \
            --comment-file /tmp/claim/comment.md \
            --model "$TRIAGE_MODEL")
          echo "$result"
          echo "wants=$(echo "$result" | python3 -c \
            'import json,sys; print(str(json.load(sys.stdin)["wants_to_claim"]).lower())')" \
            >> "$GITHUB_OUTPUT"

      - name: Answer the claim
        if: >-
          steps.gate.outputs.verdict == 'explicit' ||
          steps.intent.outputs.wants == 'true'
        uses: actions/github-script@v7
        env:
          CLAIM_DAYS: ${{ env.CLAIM_DAYS }}
        with:
          script: |
            const issue_number = context.payload.issue.number;
            const { owner, repo } = context.repo;
            const who = context.payload.comment.user.login;
            const days = Number(process.env.CLAIM_DAYS);

            const { data: labels } =
              await github.rest.issues.listLabelsOnIssue({
                owner, repo, issue_number,
              });
            const names = labels.map((l) => l.name);
            const has = (n) => names.includes(n);
            const triaged = names.some((n) => n.startsWith('triage/'));

            const say = (body) => github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });

            // Someone already holds it. Name them rather than silently
            // refusing, so the newcomer knows who to talk to.
            if (has('triage/claimed')) {
              const { data: comments } =
                await github.rest.issues.listComments({
                  owner, repo, issue_number, per_page: 100,
                });
              const record = comments.reverse().find(
                (c) => c.body.includes('<!-- claim-record -->'),
              );
              const holder = record
                ? (record.body.match(/@([\w-]+)/) || [])[0] || 'someone'
                : 'someone';
              await say(
                `This issue is already claimed by ${holder}. If they have ` +
                `gone quiet the claim is released after ${days} days of ` +
                `inactivity, and you are welcome to take it then.`,
              );
              return;
            }

            if (has('triage/verifying')) {
              await say(
                'This issue is still being verified. Please comment again ' +
                'once it is confirmed, and it is yours.',
              );
              return;
            }

            // The verification workflow only labels issues opened after it
            // landed, so an unlabelled issue is old rather than unchecked.
            if (!triaged) {
              await say(
                'This issue predates automatic verification, so nobody has ' +
                'confirmed it yet. @DavdGao can confirm it, and then it is ' +
                'yours to take.',
              );
              return;
            }

            if (!has('triage/confirmed')) {
              await say(
                'This issue has not been confirmed as a bug, so it is not ' +
                'open for work yet. Its current labels: ' +
                names.filter((n) => n.startsWith('triage/')).join(', ') + '.',
              );
              return;
            }

            // On the roadmap means the team owns it, unless it is explicitly
            // offered to the community.
            if (has('Roadmap') && !has('Help Wanted')) {
              await say(
                'Thanks for offering. This one is on the roadmap and the ' +
                'maintainers are carrying it, so it is not open to the ' +
                'community yet — issues that are carry the `Help Wanted` ' +
                'label.',
              );
              return;
            }

            const until = new Date(Date.now() + days * 86400000)
              .toISOString()
              .slice(0, 10);
            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: ['triage/claimed'],
            });
            await say(
              `<!-- claim-record -->\nClaimed by @${who} until ${until}. ` +
              `The claim is released automatically after ${days} days with ` +
              `no linked pull request, so nobody is blocked if plans ` +
              `change — comment here to renew it.`,
            );
