# ─────────────────────────────────────────────────────────────────────────────
# Template: copy this file to the MONITORED repo at
#   .github/workflows/github-monitor.yml
#
# Required secrets in the monitored repo:
#   - STORAGE_REPO_TOKEN   Fine-grained PAT with Contents: Read & Write on
#                          the storage repo (e.g. DavdGao/agentscope-monitor).
#   - DINGTALK_WEBHOOK     Dingtalk bot webhook URL.
#   - DINGTALK_SECRET      (optional) Dingtalk bot signing secret.
# ─────────────────────────────────────────────────────────────────────────────
name: GitHub Monitor

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    # synchronize is silent (stored only) — see SILENT_REALTIME_EVENTS in scripts/config.py.
    # It's needed for the daily "PRs with new commits to re-review" section.
    types: [opened, closed, reopened, synchronize, review_requested]
  # pull_request_review(_comment) can't be watched here: GitHub withholds secrets
  # from the runs they trigger on fork PRs, so the job always fails at checkout.
  discussion:
    types: [created, answered]
  discussion_comment:
    types: [created]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout storage repo (notification scripts)
        uses: actions/checkout@v4
        with:
          repository: DavdGao/agentscope-monitor
          token: ${{ secrets.STORAGE_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Upgrade pip certificate bundle
        # Verify the bootstrap wheel even if the old pip trusts unsafe CAs.
        # Hash from the Python.org emSign incident advisory.
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - run: python -m pip install "certifi>=2026.10.19" -r requirements.txt

      - name: Send notification
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PAYLOAD: ${{ toJson(github.event) }}
          REPO_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          STORAGE_REPO: DavdGao/agentscope-monitor
          STORAGE_REPO_TOKEN: ${{ secrets.STORAGE_REPO_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python -m scripts.notify
