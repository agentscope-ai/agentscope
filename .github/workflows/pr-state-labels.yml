name: PR State Labels

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited]
  workflow_run:
    workflows: [PR Review Relay]
    types: [completed]

permissions:
  pull-requests: write
  # Reading the assignees of the issues a pull request closes.
  issues: read
  actions: read

env:
  MAINTAINERS: DavdGao qbc2016
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # New commits (or a fresh PR) hand the ball back to the maintainers.
  on-push:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - if: github.event.action != 'edited' && !github.event.pull_request.draft
        run: |
          gh pr edit "$PR" --add-label "pr/awaiting-review" --remove-label "pr/awaiting-changes"

      - if: github.event.action == 'opened' || github.event.action == 'edited'
        run: |
          linked=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences | length')
          if [ "$linked" = 0 ]; then
            gh pr edit "$PR" --add-label "pr/no-linked-issue"
          else
            gh pr edit "$PR" --remove-label "pr/no-linked-issue"
          fi

      # Say out loud what the labels only hint at: no issue to close, or
      # somebody else is already on the one this closes. `closingIssuesReferences`
      # is the same source the label above uses, so there is one answer to
      # "what does this close", and it sees links made through the sidebar
      # rather than only the ones spelled out in the body.
      - if: github.event.action == 'opened' || github.event.action == 'edited'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const MARKER = '<!-- pr-guard -->';
            if (process.env.MAINTAINERS.split(/\s+/).includes(author)) return;

            // `edited` fires on every body change, so the same note is not
            // repeated — but the note is rewritten when it changes, because a
            // pull request can gain a linked issue after being told it had
            // none. Only this bot's own comment counts: otherwise anyone could
            // post the marker and switch the check off.
            const mine = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pr.number, per_page: 100 },
            );
            const previous = mine.find(
              (c) => c.user.type === 'Bot' && c.body.includes(MARKER),
            );

            // One query answers everything: what this closes, who holds
            // those issues, and which other pull requests really close them.
            // A cross-reference is only a mention, so each candidate is asked
            // what it closes — otherwise a pull request that merely names the
            // issue would read as a duplicate.
            const { repository } = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) {
                      nodes {
                        number
                        assignees(first: 10) { nodes { login } }
                        timelineItems(
                          first: 100, itemTypes: [CROSS_REFERENCED_EVENT]
                        ) {
                          nodes {
                            ... on CrossReferencedEvent {
                              source {
                                ... on PullRequest {
                                  number state author { login }
                                  closingIssuesReferences(first: 10) {
                                    nodes { number }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`, { owner, repo, number: pr.number });
            const issues =
              repository.pullRequest.closingIssuesReferences.nodes;

            const notes = [];
            if (issues.length === 0) {
              notes.push(
                '- This pull request does not close an issue. Please open ' +
                'one describing the problem first and link it with ' +
                '`Fixes #<number>`, so the change can be discussed against ' +
                'the problem it solves.',
              );
            }
            for (const issue of issues) {
              const holders = issue.assignees.nodes.map((a) => a.login);
              if (holders.length && !holders.includes(author)) {
                notes.push(
                  `- #${issue.number} is claimed by ` +
                  `${holders.map((h) => '@' + h).join(', ')}. Please leave it ` +
                  'with them while the claim stands.',
                );
              }
              for (const node of issue.timelineItems.nodes) {
                const other = node.source;
                if (!other || !other.number) continue;
                if (other.number === pr.number || other.state !== 'OPEN') {
                  continue;
                }
                const closes = other.closingIssuesReferences.nodes.some(
                  (i) => i.number === issue.number,
                );
                if (!closes) continue;
                notes.push(
                  other.author.login === author
                    ? `- #${issue.number} already has your own open pull ` +
                      `request #${other.number}. Consider continuing there.`
                    : `- #${issue.number} already has an open pull request, ` +
                      `#${other.number} by @${other.author.login}.`,
                );
              }
            }

            if (notes.length === 0) {
              // Nothing left to say. An earlier note stays as a record of what
              // was asked; the labels already show the current state.
              return;
            }

            const body =
              `${MARKER}\nThanks for the pull request. One thing worth ` +
              `sorting out before it is reviewed:\n\n${notes.join('\n')}\n\n` +
              `If you think it belongs here anyway, say so and a ` +
              `maintainer will take a look.`;
            if (previous) {
              if (previous.body.trim() === body.trim()) return;
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body,
            });

  # A maintainer review hands the ball to the author.
  on-review:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: gh run download ${{ github.event.workflow_run.id }} -n review
      - run: |
          read -r number author reviewer state < <(jq -r '"\(.number) \(.author) \(.reviewer) \(.state)"' review.json)
          case " $MAINTAINERS " in *" $reviewer "*) ;; *) exit 0 ;; esac
          if [ "$reviewer" = "$author" ]; then exit 0; fi
          if [ "$state" = approved ]; then
            gh pr edit "$number" --remove-label "pr/awaiting-review" --remove-label "pr/awaiting-changes"
          else
            gh pr edit "$number" --add-label "pr/awaiting-changes" --remove-label "pr/awaiting-review"
          fi
