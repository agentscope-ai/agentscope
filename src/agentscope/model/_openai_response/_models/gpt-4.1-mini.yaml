name: gpt-4.1-mini
label: GPT-4.1 Mini (Responses API)
status: active
# Release date source: https://developers.openai.com/api/docs/changelog
release_date: 2025-04-14

input_types:
  - text/plain
  - image/jpeg
  - image/png
  - image/gif
  - image/webp
  - application/pdf

output_types:
  - text/plain

context_size: 1047576
