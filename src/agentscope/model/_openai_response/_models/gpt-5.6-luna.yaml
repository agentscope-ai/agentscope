name: gpt-5.6-luna
label: GPT-5.6 Luna (Responses API)
status: active
# Release date source: https://developers.openai.com/api/docs/changelog
release_date: 2026-07-09

input_types:
  - text/plain
  - image/jpeg
  - image/png
  - image/gif
  - image/webp
  - application/pdf

output_types:
  - text/plain

context_size: 1050000
output_size: 128000

parameter_overrides:
  max_tokens:
    maximum: 128000
  # Reasoning happens internally and is never returned as content, so the
  # thinking toggle has nothing to surface — reasoning_effort is the knob.
  thinking_enable:
    hidden: true
