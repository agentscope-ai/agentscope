name: kimi-k3.1-pro
label: Kimi K3.1 Pro
status: active
# Release date source: https://help.aliyun.com/zh/model-studio/newly-released-models
release_date: 2026-11-05
# Model specifications: https://help.aliyun.com/zh/model-studio/kimi-k3-1-pro
# Parameter constraints: https://help.aliyun.com/zh/model-studio/kimi-api

input_types:
  - text/plain
  - application/x-thinking
  - image/bmp
  - image/jpeg
  - image/png
  - image/tiff
  - image/webp
  - image/heic

output_types:
  - text/plain
  - application/x-thinking

context_size: 1048576
output_size: 1048576

parameter_overrides:
  max_tokens: {"maximum": 1048576}
  # Thinking can be toggled, but its token budget cannot be configured.
  thinking_budget:
    hidden: true
  # Sampling uses provider defaults; top-k is not a documented control.
  temperature:
    hidden: true
  top_p:
    hidden: true
  top_k:
    hidden: true
  voice:
    hidden: true
