name: deepseek-v4.1-flash
label: DeepSeek V4.1 Flash
status: active

input_types:
  - text/plain
  - image/bmp
  - image/jpeg
  - image/png
  - image/tiff
  - image/webp
  - image/heic

output_types:
  - text/plain
  - application/x-thinking

context_size: 1000000
output_size: 393216

parameter_overrides:
  max_tokens: {"maximum": 393216}
  # Max chain-of-thought is 393216 tokens.
  thinking_budget: {"maximum": 393216}
  # Voice only applies to omni-style models; hide the field for this
  # non-omni model so the frontend popover doesn't render it.
  voice:
    hidden: true
