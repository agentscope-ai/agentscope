name: gpt-5.5
label: GPT-5.5
status: active
# Release date source: https://developers.openai.com/api/docs/changelog
release_date: 2026-04-24

input_types:
  - text/plain
  - image/jpeg
  - image/png
  - image/gif
  - image/webp
  - application/pdf

output_types:
  - text/plain

context_size: 1050000
output_size: 128000

parameter_overrides:
  max_tokens:
    maximum: 128000
  thinking_enable:
    hidden: true
  reasoning_effort:
    hidden: true
  # Voice only applies to omni-style models; hide the field for this
  # non-omni model so the frontend popover doesn't render it.
  voice:
    hidden: true
