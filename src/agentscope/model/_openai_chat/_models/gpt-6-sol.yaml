# Source: https://developers.openai.com/api/docs/models/gpt-6-sol
# Use Responses for agent tool calls; Chat has reasoning restrictions.
name: gpt-6-sol
label: GPT-6 Sol
status: active

input_types:
  - text/plain
  - image/jpeg
  - image/png
  - image/gif
  - image/webp
  - application/pdf

output_types:
  - text/plain

context_size: 1050000
output_size: 128000

parameter_overrides:
  # The adapter gates effort on thinking_enable, which is auto-hidden.
  # Keep the provider's default reasoning until that gate is updated.
  reasoning_effort:
    hidden: true
  temperature:
    hidden: true
  top_p:
    hidden: true
