# Source: https://platform.claude.com/docs/en/models/fable-5-2/whats-new-fable-5-2
name: claude-fable-5-2
label: Claude Fable 5.2
status: active
# Release date source: https://platform.claude.com/docs/en/release-notes/overview
release_date: 2026-11-09

input_types:
  - text/plain
  - application/x-thinking
  - image/jpeg
  - image/png
  - image/gif
  - image/webp
  - application/pdf

output_types:
  - text/plain
  - application/x-thinking

context_size: 1000000
output_size: 128000

parameter_overrides:
  # Adaptive thinking is always on; use effort to control its depth.
  thinking_enable:
    hidden: true
  thinking_budget:
    hidden: true
  thinking_mode:
    default: adaptive
    anyOf:
      - enum: [adaptive]
        type: string
      - type: "null"
  thinking_display:
    default: summarized
  reasoning_effort:
    default: high
