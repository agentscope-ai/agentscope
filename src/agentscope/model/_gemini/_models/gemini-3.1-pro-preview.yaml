name: gemini-3.1-pro-preview
label: Gemini 3.1 Pro Preview
status: active
# Release date source: https://aistudio.google.com/docs/changelog
release_date: 2026-02-19

input_types:
  - text/plain
  - image/jpeg
  - image/png
  - image/gif
  - image/webp
  - audio/mp3
  - audio/wav
  - video/mp4
  - application/pdf

output_types:
  - text/plain
  - application/x-thinking

context_size: 1048576
output_size: 65536

parameter_overrides:
  thinking_level:
    hidden: true
  max_tokens:
    maximum: 65536
