  # VAD and hotwords stay internal until they have purpose-built controls.
  sample_rate:
    hidden: true
  language_hints:
    hidden: true
  vad_model:
    hidden: true
  vocabulary_id:
    hidden: true
  vocabulary:
    hidden: true
