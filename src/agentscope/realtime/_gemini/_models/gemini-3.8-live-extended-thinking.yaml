# Source: https://ai.google.dev/gemini-api/docs/models/gemini-3.8-live-extended-thinking
type: realtime_model
name: gemini-3.8-live-extended-thinking
label: Gemini 3.8 Live Extended Thinking
status: active
# Source: https://aistudio.google.com/docs/changelog#09-15-2026
release_date: 2026-09-15

# Image input is not implemented by the current realtime adapter.
input_types:
  - audio/pcm
  - text/plain
output_types:
  - audio/pcm
  - text/plain

input_sample_rate: 16000
output_sample_rate: 24000
supports_tools: true
supports_extended_thinking: true
max_context_tokens: 131072
# Audio-only duration without context-window compression.
# Source: https://aistudio.google.com/docs/live-api/session-management
max_session_duration_s: 900

parameter_overrides:
  voice:
    enum: ["Zephyr", "Puck", "Charon", "Kore", "Fenrir", "Leda", "Orus",
           "Aoede", "Callirrhoe", "Autonoe", "Enceladus", "Iapetus",
           "Umbriel", "Algieba", "Despina", "Erinome", "Algenib",
           "Rasalgethi", "Laomedeia", "Achernar", "Alnilam", "Schedar",
           "Gacrux", "Pulcherrima", "Achird", "Zubenelgenubi",
           "Vindemiatrix", "Sadachbia", "Sadaltager", "Sulafat"]
