type: realtime_model
name: gpt-realtime
label: GPT Realtime
status: active

input_types:
  - audio/pcm
  - text/plain
output_types:
  - audio/pcm
  - text/plain

# The GA protocol only speaks 24 kHz PCM, in both directions.
input_sample_rate: 24000
output_sample_rate: 24000

supports_tools: true

max_context_tokens: 32000
max_session_duration_s: 3600
