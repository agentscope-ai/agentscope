type: realtime_model
name: qwen-audio-3.0-realtime-flash
label: Qwen-Audio-3.0-Realtime-Flash
status: active

input_types:
  - audio/pcm
  - text/plain
output_types:
  - audio/pcm
  - text/plain

input_sample_rate: 16000
output_sample_rate: 24000

supports_tools: true

# Turns and cumulative audio seconds both apply; the provider discards
# the oldest turn once either is exceeded.
max_audio_turns: 50
max_audio_duration_s: 300

parameter_overrides:
  voice:
    default: "longanqian"
    enum:
      - "longanqian"
      - "longanlingxin"
      - "longanlingxi"
      - "longanxiaoxin"
      - "longanlufeng"
