name: tts-1-hd
label: TTS-1 HD
status: active
# Release date source: https://openai.com/index/new-models-and-developer-products-announced-at-devday/
release_date: 2023-11-06

input_types:
  - text/plain

output_types:
  - audio/mpeg
  - audio/opus
  - audio/aac
  - audio/flac
  - audio/wav
  - audio/pcm

voices:
  # Source: https://platform.openai.com/docs/guides/text-to-speech
  - alloy
  - ash
  - coral
  - echo
  - fable
  - onyx
  - nova
  - sage
  - shimmer

parameter_overrides:
  # The instructions parameter is not supported by tts-1-hd, hide it from
  # the frontend to avoid confusing users.
  instructions:
    hidden: true
