# nginx 网关：统一入口，代理前端与后端 API
# 以 envsubst 模板挂载到 /etc/nginx/templates/default.conf.template，
# ${FRONTEND_UPSTREAM} 由 compose 环境变量注入：
#   dev 模式 → webui-frontend:5173（vite dev server）
#   prod 模式 → webui-frontend:80（容器内 nginx 静态托管）

# HMR / WebSocket 升级支持（浏览器带 Upgrade 头时透传，否则保持 close）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 上传/大文件限制
    client_max_body_size 100m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API 请求透传到 Agent Service（不剥前缀：/api/agent/ → /api/agent/）。
    # 后端所有路由统一挂载在 /api 下（含 deerflow /api/threads 等），
    # 与 webui 前端契约一致（client.ts：后端自带 /api，网关直接透传）。
    location /api/ {
        proxy_pass http://agentscope-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应：关闭缓冲，拉长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 其余请求转发到前端（dev 时为 vite dev server，SPA 回退/资源均由其处理）
    location / {
        proxy_pass http://${FRONTEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # vite HMR 的 WebSocket 透传
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
